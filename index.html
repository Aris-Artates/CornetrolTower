<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corne-troll Tower</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#121a2b; --panel-2:#0e1524; --line:#24324f;
  --amber:#ffb703; --amber-soft:#ffd166; --text:#e8edf7; --dim:#93a0b8;
  --green:#3ddc84; --red:#ff5d5d; --blue:#57b3ff; --violet:#b586ff;
  --board:#05070d;
  --mono:'Cascadia Mono','Consolas','Menlo',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 'Segoe UI',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* ── Top bar ─────────────────────────────────────────── */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;
  background:var(--board);border-bottom:2px solid var(--line);font-family:var(--mono)}
#topbar .brand{color:var(--amber);letter-spacing:.18em;font-weight:700;text-transform:uppercase;font-size:14px;white-space:nowrap}
#topbar .crumb{color:var(--dim);font-size:13px;letter-spacing:.08em}
#topbar .spacer{flex:1}
#topbar .hud{display:flex;gap:16px;font-size:13px;color:var(--amber-soft)}
#topbar .hud b{color:var(--text)}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,#101010 10px 20px);opacity:.85}

/* ── Screen area ─────────────────────────────────────── */
#screen{flex:1 1 auto;overflow:auto;position:relative}
.wrap{max-width:1060px;margin:0 auto;padding:22px 20px 40px}
h1.board,h2.board{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em;color:var(--amber);margin:.2em 0 .5em}
h1.board{font-size:26px}h2.board{font-size:17px}
.subtle{color:var(--dim)}
.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:9px 18px;cursor:pointer;transition:border-color .12s, background .12s}
.btn:hover{border-color:var(--amber);background:#182238}
.btn.primary{background:var(--amber);color:#111;border-color:var(--amber);font-weight:600}
.btn.primary:hover{background:var(--amber-soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── Main menu ───────────────────────────────────────── */
.menu-hero{font-family:var(--mono);text-align:center;margin:48px 0 8px}
.menu-hero .tower{font-size:44px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 24px rgba(255,183,3,.25)}
.menu-hero .tag{color:var(--dim);letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin-top:6px}
.menu-list{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:34px auto}
.menu-list .btn{font-family:var(--mono);letter-spacing:.25em;text-transform:uppercase;text-align:center;
  font-size:17px;padding:15px}
.storage-note{color:var(--red);text-align:center;font-size:12px}

/* ── Cards (stages / levels) ─────────────────────────── */
.cardgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;
  transition:border-color .12s;position:relative;min-height:118px}
.card:hover:not(.locked){border-color:var(--amber)}
.card.locked{opacity:.55;cursor:default}
.card .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
.card h3{margin:4px 0 6px;font-size:16px}
.card .meta{font-size:12.5px;color:var(--dim)}
.card .best{font-size:12.5px;color:var(--green);margin-top:6px;font-family:var(--mono)}
.card .lockline{font-size:12px;color:var(--amber-soft);margin-top:6px}
.card .done{position:absolute;top:10px;right:12px;color:var(--green);font-size:15px}
.profilebar{margin-top:26px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  font-family:var(--mono);font-size:13px;display:flex;gap:26px;flex-wrap:wrap;color:var(--dim)}
.profilebar b{color:var(--amber-soft)}

/* ── Settings ────────────────────────────────────────── */
.set-row{display:flex;align-items:center;gap:14px;margin:16px 0;max-width:440px}
.set-row label{width:110px;color:var(--dim);font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.set-row input[type=range]{flex:1;accent-color:var(--amber)}
.set-row .val{width:42px;text-align:right;font-family:var(--mono);color:var(--amber-soft)}
/* Secret unlock-all: invisible at rest, real focusable element in tab order */
#secret-unlock{display:block;width:260px;height:30px;margin:26px 0 0;background:transparent;border:none;
  color:transparent;cursor:default;border-radius:6px}
#secret-unlock:hover{cursor:pointer;outline:1px dashed rgba(255,183,3,.55)}
#secret-unlock:focus-visible{outline:2px solid var(--blue);outline-offset:2px;color:var(--dim)}

/* ── Toast / modal ───────────────────────────────────── */
#toast{position:fixed;top:14px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#152038;border:1px solid var(--amber);border-radius:8px;padding:10px 16px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .18s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.modal-veil{position:fixed;inset:0;background:rgba(5,7,13,.72);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px;min-width:340px;max-width:560px;
  box-shadow:0 14px 50px rgba(0,0,0,.6)}
.modal h3{font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}
.modal h3.pass{color:var(--green)} .modal h3.fail{color:var(--red)}
.statrows{margin:10px 0;font-family:var(--mono);font-size:13.5px}
.statrows div{display:flex;justify-content:space-between;gap:30px;padding:3px 0;border-bottom:1px dashed #22304d}
.statrows div span:last-child{color:var(--amber-soft)}
.modal .acts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.gate-note{font-size:12.5px;color:var(--dim);margin-top:8px}

/* ── Corne guide ─────────────────────────────────────── */
#guide{flex:0 0 auto;background:var(--board);border-top:2px solid var(--line);font-family:var(--mono);z-index:20}
#guide .g-head{display:flex;align-items:center;gap:12px;padding:5px 14px;cursor:pointer;user-select:none}
#guide .g-head .g-title{color:var(--amber);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
#guide .g-head .g-layer{color:var(--blue);font-size:12px;letter-spacing:.1em}
#guide .g-head .g-hint{flex:1;color:var(--text);font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guide .g-head .g-fold{color:var(--dim);font-size:12px}
#guide .g-body{display:flex;justify-content:center;gap:46px;padding:6px 10px 12px}
#guide.folded .g-body{display:none}
.kb-half{display:flex;flex-direction:column;gap:4px}
.kb-row{display:flex;gap:4px}
.kb-thumbs{display:flex;gap:4px;margin-top:4px}
.kb-half.left .kb-thumbs{justify-content:flex-end;margin-right:2px}
.kb-half.right .kb-thumbs{justify-content:flex-start;margin-left:2px}
.key{width:44px;height:40px;border:1px solid #2c3a5c;border-radius:6px;background:#101828;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12px;line-height:1.05;position:relative;color:var(--text)}
.key .sub{font-size:8.5px;color:var(--violet);margin-top:1px}
.key.blank{opacity:.28}
.key.transparent{color:var(--dim);opacity:.55}
.key.need{border-color:var(--amber);background:#2b230a;color:var(--amber);box-shadow:0 0 10px rgba(255,183,3,.55);z-index:1}
.key.need .sub{color:var(--amber-soft)}
.key.hold{border-color:var(--green);background:#0c2317;color:var(--green);box-shadow:0 0 10px rgba(61,220,132,.5)}
.key.thumb{width:52px;border-radius:14px}

/* ── Stage 1: typing ─────────────────────────────────── */
.t-stage{max-width:900px;margin:0 auto;padding:18px 20px}
.t-meters{display:flex;gap:26px;font-family:var(--mono);font-size:14px;margin:10px 0;color:var(--dim)}
.t-meters b{color:var(--amber);font-size:20px}
.t-phase{display:flex;gap:8px;margin:8px 0 14px}
.t-phase .btn{font-size:12.5px;padding:5px 12px}
.t-phase .btn.on{border-color:var(--amber);color:var(--amber)}
.t-text{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:22px 26px;
  font-family:var(--mono);font-size:22px;line-height:2;letter-spacing:.03em;min-height:150px;user-select:none;white-space:pre-wrap;word-break:break-word}
.tok{border-radius:3px;padding:0 1px}
.tok.done{color:#5a9b74}
.tok.cur{background:var(--amber);color:#111;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#6b5310;color:var(--amber)}}
.tok.err{color:var(--red);text-decoration:underline}
.tok.wrongchar{color:#fff;background:var(--red);border-radius:3px}
.tok.special{border:1px solid var(--blue);color:var(--blue);font-size:14px;padding:2px 7px;border-radius:6px;margin:0 3px}
.tok.special.cur{background:var(--blue);color:#111;animation:none}
.tok.special.done{opacity:.45}
.t-note{color:var(--dim);font-size:13px;margin-top:10px}

/* ── Stage 2: x-ray ──────────────────────────────────── */
.xr-wrap{display:flex;flex-direction:column;height:100%;padding:10px 16px 6px;gap:8px}
.xr-hud{display:flex;gap:22px;font-family:var(--mono);font-size:13px;color:var(--dim);align-items:center}
.xr-hud b{color:var(--amber)}
.xr-monitor{flex:1;position:relative;background:#071022;border:2px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}
.xr-monitor::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(87,179,255,.045) 0 2px,transparent 2px 4px)}
.xr-belt{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#141414 0 26px,#1f1f1f 26px 52px);border-top:2px solid #333}
.bag{position:absolute;border:2px solid #3a4d79;border-radius:14px;background:rgba(38,64,120,.35)}
.bag .bagtag{position:absolute;top:-19px;left:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.1em}
.xitem{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;line-height:1}
.xitem .glyph{font-size:26px;filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}
.xitem.red .glyph{filter:drop-shadow(0 0 6px rgba(255,93,93,.9))}
.xitem .badge{font-size:10px;margin-top:2px}
.xitem.red .badge{color:var(--red)} .xitem.safe .badge{color:#dfe7f5}
.xitem.tagged{outline:2px solid var(--green);border-radius:8px;opacity:.55;pointer-events:none}
.xitem.falsetag{outline:2px dashed var(--red);border-radius:8px}
.xr-report{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--amber);border-radius:10px;padding:9px 14px;font-family:var(--mono)}
.xr-report input{flex:0 0 320px;background:#0a1120;border:1px solid var(--line);border-radius:6px;color:var(--amber-soft);
  font:16px var(--mono);padding:6px 10px}
.xr-report input:focus{outline:1px solid var(--amber)}
.xr-panel{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:420px;background:var(--panel);
  border:1px solid var(--amber);border-radius:12px;padding:14px 18px;z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.65)}
.xr-panel h4{margin:0 0 8px;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--amber);font-size:13px}
.xr-panel .entry{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:7px;font-family:var(--mono);font-size:14px}
.xr-panel .entry.sel{background:#22304d;outline:1px solid var(--blue)}
.xr-panel .entry .eglyph{font-size:19px}
.xr-panel .entry.redE .ename{color:var(--red)} .xr-panel .entry.safeE .ename{color:#dfe7f5}
.xr-panel .entry.doneE{opacity:.45;text-decoration:line-through}
.xr-panel .entry input{margin-left:auto;width:170px;background:#0a1120;border:1px solid var(--line);border-radius:5px;
  color:var(--amber-soft);font:13px var(--mono);padding:3px 7px}
.xr-panel .phint{color:var(--dim);font-size:11.5px;margin-top:8px}

/* ── Stage 3: IDE ────────────────────────────────────── */
.ide{display:grid;grid-template-columns:170px 1fr 320px;grid-template-rows:1fr 148px;gap:8px;height:100%;padding:10px 14px 6px}
.ide .tree{grid-row:1/3;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:13px;overflow:auto}
.ide .tree .fitem{padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--dim)}
.ide .tree .fitem:hover{color:var(--text)} .ide .tree .fitem.open{color:var(--amber);background:#1b2540}
.ide .center{display:flex;gap:8px;min-width:0;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.pane.activePane{border-color:var(--blue)}
.pane .tabs{display:flex;gap:2px;background:#0a101f;padding:4px 6px 0;font-family:var(--mono);font-size:12px}
.pane .tabs .tab{padding:4px 12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--dim);background:#0e1524}
.pane .tabs .tab.on{color:var(--amber);background:var(--panel-2);border:1px solid var(--line);border-bottom:none}
.edwrap{position:relative;flex:1;min-height:0}
.edwrap pre,.edwrap textarea{margin:0;position:absolute;inset:0;padding:10px 12px;font:14px/1.5 var(--mono);
  white-space:pre;overflow:auto;border:none;letter-spacing:normal;tab-size:4}
.edwrap pre{color:transparent;pointer-events:none;z-index:0}
.edwrap pre .ok{background:rgba(61,220,132,.10)}
.edwrap pre .bad{background:rgba(255,93,93,.32)}
.edwrap textarea{background:transparent;color:var(--text);resize:none;z-index:1;outline:none;caret-color:var(--amber)}
.ide .ticketcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.ticket{background:var(--panel);border:1px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:13px}
.ticket .tid{font-family:var(--mono);color:var(--amber);letter-spacing:.12em;font-size:11.5px;text-transform:uppercase}
.ticket .brief{margin-top:5px;color:var(--text)}
.targetview{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0}
.targetview pre{margin:0;padding:10px 12px;font:12.5px/1.5 var(--mono);color:#9fd3a8;white-space:pre}
.targetview .tv-head{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.15em;padding:6px 12px 0;text-transform:uppercase}
.term{grid-column:2/4;background:#04070e;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;font-family:var(--mono);font-size:13px;overflow:hidden}
.term.activePane{border-color:var(--blue)}
.term .tout{flex:1;overflow:auto;padding:8px 12px;color:#9fd3a8;white-space:pre-wrap}
.term .tline{display:flex;gap:8px;padding:4px 12px;border-top:1px solid var(--line)}
.term .tline input{flex:1;background:transparent;border:none;color:var(--amber-soft);font:13px var(--mono);outline:none}
.ide-hud{grid-column:1/4;display:flex;gap:22px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}

/* ── Stage 4: tower ──────────────────────────────────── */
.tw-wrap{display:flex;flex-direction:column;height:100%;padding:10px 16px 6px;gap:8px}
.tw-hud{display:flex;gap:22px;font-family:var(--mono);font-size:13px;color:var(--dim);align-items:center}
.tw-hud b{color:var(--amber)}
.radar{flex:1;position:relative;background:radial-gradient(circle at 50% 88%,#07240f 0%,#03140a 65%,#020c06 100%);
  border:2px solid #1d3a26;border-radius:12px;overflow:hidden;min-height:320px}
.radar .ring{position:absolute;border:1px solid rgba(61,220,132,.14);border-radius:50%;pointer-events:none}
.runway{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:34px;height:110px;background:#222;
  border:2px solid #555;border-radius:4px}
.runway::before{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:3px;transform:translateX(-50%);
  background:repeating-linear-gradient(0deg,#ddd 0 9px,transparent 9px 18px)}
.runway.busy{border-color:var(--amber)}
.plane{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);z-index:2}
.plane .ftag{font-family:var(--mono);font-size:11.5px;background:#12233a;border:1px solid var(--blue);color:var(--blue);
  border-radius:5px;padding:1px 6px;margin-bottom:2px;letter-spacing:.06em}
.plane .icon{font-size:20px;transform:rotate(var(--hdg,0deg))}
.plane .fuel{width:34px;height:4px;background:#333;border-radius:2px;margin-top:2px;overflow:hidden}
.plane .fuel i{display:block;height:100%;background:var(--green)}
.plane .fuel i.low{background:var(--red)}
.plane .callsign{font-family:var(--mono);font-size:9px;color:var(--dim)}
.plane.candidate .ftag{border-color:var(--amber);color:var(--amber)}
.plane.sel .ftag{background:var(--amber);color:#111;border-color:var(--amber)}
.plane.sel .icon{filter:drop-shadow(0 0 8px rgba(255,183,3,.9))}
.plane.closest::after{content:'';position:absolute;inset:-7px -4px;border:1px dashed rgba(61,220,132,.5);border-radius:10px;pointer-events:none}
.plane.landing{opacity:.85}
.tw-msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:13px;
  color:var(--amber);background:rgba(5,7,13,.8);border:1px solid var(--line);padding:5px 14px;border-radius:8px;z-index:6}
.tw-numpad{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);
  border-radius:10px;padding:10px 16px;font-family:var(--mono);z-index:6;text-align:center}
.tw-numpad .np-in{font-size:20px;letter-spacing:.3em;color:var(--amber);min-height:26px}

/* ── Briefing overlay ────────────────────────────────── */
.brief-veil{position:absolute;inset:0;background:rgba(5,7,13,.82);z-index:10;display:flex;align-items:center;justify-content:center}
.briefing{background:var(--panel);border:1px solid var(--amber);border-radius:12px;padding:22px 28px;max-width:560px}
.briefing h3{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:0 0 10px}
.briefing ul{margin:8px 0;padding-left:20px;color:var(--dim);font-size:13.5px}
.briefing ul li{margin:4px 0}
.briefing kbd{font-family:var(--mono);background:#0a1120;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--amber-soft)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div class="stripe"></div>
  <div id="screen"></div>
  <div id="guide"></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   KEYMAP — 46-KEY CORNE, DVORAK PROGRAMMER (v1)
   Encoded verbatim from the spec appendix. Single source of truth:
   every diagram, hint and drill reads from this structure.
   Cell: { l:label, k:output (KeyboardEvent.key), s:shifted output,
           sub:home-row-mod label, hold:layer this thumb activates,
           blank:true (no-op), trans:true (▽ transparent) }
   ════════════════════════════════════════════════════════════════ */
const KEYMAP = {
  layerNames: ['BASE', 'NAV & MOUSE', 'SYM', 'FN'],
  holdDesc: { NAV: 'left thumb · inner key', SYM: 'right thumb · middle key', FN: 'right thumb · outer key' },
  layers: [
    { // ── LAYER 0 — BASE (Dvorak) ──
      left: [
        [{l:'Tab',k:'Tab'},{l:"'",k:"'",s:'"'},{l:',',k:',',s:'<'},{l:'.',k:'.',s:'>'},{l:'P',k:'p'},{l:'Y',k:'y'}],
        [{l:'Esc',k:'Escape'},{l:'A',k:'a',sub:'GUI'},{l:'O',k:'o',sub:'Alt'},{l:'E',k:'e',sub:'Ctl'},{l:'U',k:'u',sub:'Sft'},{l:'I',k:'i'}],
        [{l:'Sft'},{l:';',k:';',s:':'},{l:'Q',k:'q'},{l:'J',k:'j'},{l:'K',k:'k'},{l:'X',k:'x'}]
      ],
      right: [
        [{l:'F',k:'f'},{l:'G',k:'g'},{l:'C',k:'c'},{l:'R',k:'r'},{l:'L',k:'l'},{l:'/',k:'/',s:'?'}],
        [{l:'D',k:'d'},{l:'H',k:'h',sub:'Sft'},{l:'T',k:'t',sub:'Ctl'},{l:'N',k:'n',sub:'Alt'},{l:'S',k:'s',sub:'GUI'},{l:'-',k:'-',s:'_'}],

/* ── Position lookup tables ─────────────────────────────────────── */
const KEY = (() => {
  // plainMaps[layer]: char/key -> pos ; shiftMap: shifted base output -> pos(+shift)
  const plainMaps = [new Map(), new Map(), new Map(), new Map()];
  const shiftMap = new Map();

  KEYMAP.layers.forEach((layer, li) => {
    const scan = (cells, side, row) => cells.forEach((c, col) => {
      const pos = { layer: li, side, row, col };
      if (c.k !== undefined && !plainMaps[li].has(c.k)) plainMaps[li].set(c.k, pos);
      if (li === 0 && c.s && !shiftMap.has(c.s)) shiftMap.set(c.s, { ...pos, shift: true });
      if (li === 0 && c.k && /^[a-z]$/.test(c.k)) shiftMap.set(c.k.toUpperCase(), { ...pos, shift: true });
    });
    layer.left.forEach((r, ri) => scan(r, 'L', ri));
    layer.right.forEach((r, ri) => scan(r, 'R', ri));
    scan(layer.leftThumbs, 'L', 'T');
    scan(layer.rightThumbs, 'R', 'T');
  });

  const FINGERS_L = ['pinky (outer)', 'pinky', 'ring', 'middle', 'index', 'index (inner)'];
  const FINGERS_R = ['index (inner)', 'index', 'middle', 'ring', 'pinky', 'pinky (outer)'];

  function fingerOf(pos) {
    if (pos.row === 'T') return 'thumb';
    return pos.side === 'L' ? FINGERS_L[pos.col] : FINGERS_R[pos.col];
  }
  function sideWord(pos) { return pos.side === 'L' ? 'left' : 'right'; }

  // Find a key/char. Search order: base plain → SYM → FN → base+Shift.
  function find(x) {
    for (const li of [0, 2, 3]) if (plainMaps[li].has(x)) return plainMaps[li].get(x);
    if (shiftMap.has(x)) return shiftMap.get(x);
    // NAV-only keys (arrows, Home/End, PgUp/PgDn, clipboard, mouse)
    if (plainMaps[1].has(x)) return plainMaps[1].get(x);
    return null;
  }

  function labelAt(pos) {
    const layer = KEYMAP.layers[pos.layer];
    const half = pos.side === 'L' ? layer.left : layer.right;
    const cell = pos.row === 'T'
      ? (pos.side === 'L' ? layer.leftThumbs : layer.rightThumbs)[pos.col]
      : half[pos.row][pos.col];
    return cell.l || '';
  }

  // The HRM Shift on the hand OPPOSITE the target key: U (left index) / H (right index)
  function hrmShiftFor(pos) {
    return pos.side === 'L'
      ? { layer: 0, side: 'R', row: 1, col: 1, name: 'H (right index)' }
      : { layer: 0, side: 'L', row: 1, col: 4, name: 'U (left index)' };
  }

  // Build a full hint for a character or named key.
  // Returns {layer, needs:[pos], holdThumb:pos|null, shiftKey:pos|null, text}
  function hint(x, displayLabel) {
    const pos = find(x);
    if (!pos) return null;
    const lbl = displayLabel || labelAt(pos);
    const holds = { 1: 'NAV', 2: 'SYM', 3: 'FN' }[pos.layer] || null;
    let holdThumb = null, text = '';
    if (holds) {
      const layer = KEYMAP.layers[pos.layer];
      const lt = layer.leftThumbs.findIndex(c => c.held === holds);
      const rt = layer.rightThumbs.findIndex(c => c.held === holds);
      holdThumb = lt >= 0 ? { layer: pos.layer, side: 'L', row: 'T', col: lt }
                          : { layer: pos.layer, side: 'R', row: 'T', col: rt };
      text = `Hold ${holds} (${KEYMAP.holdDesc[holds]}) · ${sideWord(pos)} ${fingerOf(pos)} → ${lbl}`;
    } else if (pos.shift) {
      const sh = hrmShiftFor(pos);
      text = `Hold Shift (${sh.name} or outer Sft) · ${sideWord(pos)} ${fingerOf(pos)} → ${lbl}`;
      return { layer: 0, needs: [pos], holdThumb: null, shiftKey: sh, text };
    } else {
      text = `${sideWord(pos)[0].toUpperCase() + sideWord(pos).slice(1)} ${fingerOf(pos)} → ${lbl}`;
    }
    return { layer: pos.layer, needs: [pos], holdThumb, shiftKey: null, text };
  }

  return { find, hint, labelAt, fingerOf, sideWord, hrmShiftFor };
})();

function el(tag, cls, html) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function irnd(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ── Level registry ─────────────────────────────────────────────── */
const LEVELS = (() => {
  const list = [];
  [CONFIG.stage1, CONFIG.stage2, CONFIG.stage3, CONFIG.stage4].forEach((arr, si) =>
    arr.forEach((def, li) => list.push({ id: def.id, stage: si + 1, idx: li, def })));
  return list;
})();
function levelAt(id) { return LEVELS.find(l => l.id === id); }
function prevLevelId(id) { const i = LEVELS.findIndex(l => l.id === id); return i > 0 ? LEVELS[i - 1].id : null; }
function nextLevelId(id) { const i = LEVELS.findIndex(l => l.id === id); return i >= 0 && i < LEVELS.length - 1 ? LEVELS[i + 1].id : null; }
function gateSummary(id) {
  const { stage, def } = levelAt(id);
  if (stage === 1) return `${def.gate.wpm} WPM @ ${def.gate.acc}%`;
  if (stage === 2) return `all reds · ≤${def.maxFalse} false tags · names ≥${def.nameAcc}% · ${fmtTime(def.time)}`;
  if (stage === 3) return `all tickets exact · first-pass ≥${def.firstPass}% · ${fmtTime(def.time)}`;
  return `land ${def.land} · ≤${def.maxWrong} wrong picks · zero fuel-outs`;
}

/* ── Save / progress ───────────────────────────────────────────── */
const Save = {
  canStore: true,
  data: null,
  load() {
    const fresh = { settings: { ...CONFIG.audio, guideOpen: true }, unlockAll: false, levels: {} };
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      this.data = raw ? Object.assign(fresh, JSON.parse(raw)) : fresh;
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.data));
    } catch (e) { this.canStore = false; this.data = fresh; }
  },
  persist() {
    if (!this.canStore) return;
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.data)); } catch (e) { this.canStore = false; }
  },
  rec(id) { return this.data.levels[id] || null; },
  passed(id) { const r = this.rec(id); return !!(r && r.passed); },
  isUnlocked(id) {
    if (this.data.unlockAll) return true;
    const prev = prevLevelId(id);
    return prev === null || this.passed(prev);
  },
  // record a run; keep the best passed run's stats (primary: higher is better unless timeBased)
  record(id, passed, stats, primary, timeBased) {
    const cur = this.data.levels[id] || {};
    cur.passed = cur.passed || passed;
    if (passed) {
      const old = cur.best;
      const better = !old || (timeBased ? stats[primary] < old[primary] : stats[primary] > old[primary]);
      if (better) cur.best = stats;
    }
    this.data.levels[id] = cur;
    this.persist();
  }
};

/* ── Audio (WebAudio; obeys Settings volumes) ───────────────────── */
const Sound = {
  ctx: null, masterG: null, musicG: null, sfxG: null, musicTimer: null,
  ensure() {
    if (this.ctx) return true;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterG = this.ctx.createGain(); this.masterG.connect(this.ctx.destination);
      this.musicG = this.ctx.createGain(); this.musicG.connect(this.masterG);
      this.sfxG = this.ctx.createGain(); this.sfxG.connect(this.masterG);
      this.applyVolumes();
    } catch (e) { return false; }
    return true;
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Save.data.settings;
    this.masterG.gain.value = s.master;
    this.musicG.gain.value = s.music;
    this.sfxG.gain.value = s.sfx;
  },
  tone(freq, dur, type, vol, dest, when) {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.02);
  },
  tick()  { this.tone(1700, 0.045, 'square', 0.12); },
  buzz()  { this.tone(130, 0.18, 'sawtooth', 0.22); this.tone(98, 0.22, 'sawtooth', 0.15, null, 0.02); },
  good()  { this.tone(880, 0.09, 'sine', 0.18); this.tone(1320, 0.12, 'sine', 0.15, null, 0.07); },
  blip()  { this.tone(520, 0.06, 'triangle', 0.14); },
  jingle() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.18, null, i * 0.11));
  },
  musicStart() {
    if (!this.ensure() || this.musicTimer) return;
    const chords = [[196, 247, 294], [175, 220, 262], [147, 196, 247], [165, 208, 262]];
    let bar = 0;
    const playBar = () => {
      const c = chords[bar % chords.length]; bar++;
      c.forEach(f => this.tone(f, 3.6, 'sine', 0.045, this.musicG));
      this.tone(pick(c) * 2, 0.5, 'triangle', 0.035, this.musicG, rnd(0.5, 2.5));
    };
    playBar();
    this.musicTimer = setInterval(playBar, 4000);
  },
  musicStop() { if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; } }
};

/* ── Global key capture (ground rule 3) ─────────────────────────── */
const Keys = {
  ctx: null,   // { onKey(e, editable) -> true if consumed, capture: true }
  set(c) { this.ctx = c; },
  clear() { this.ctx = null; },
  install() {
    document.addEventListener('keydown', (e) => {
      Sound.ensure();
      if (e.defaultPrevented) return;         // an element handler already dealt with it
      const c = this.ctx;
      if (!c) return;
      const t = e.target;
      const editable = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (c.onKey && c.onKey(e, editable)) { e.preventDefault(); return; }
      if (!c.capture) return;
      const k = e.key;
      // keys browsers normally steal: Tab, F1–F12, Esc — always; quick-find
      // chars, Space-scroll, Backspace-nav, arrows/paging — outside inputs.
      if (k === 'Tab' || k === 'Escape' || /^F\d{1,2}$/.test(k)) { e.preventDefault(); return; }
      if (!editable && (k === "'" || k === '/' || k === ' ' || k === 'Backspace'
          || k.startsWith('Arrow') || k === 'Home' || k === 'End' || k === 'PageUp' || k === 'PageDown')) {
        e.preventDefault();
      }
    });
    document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
  }
};

/* ── UI plumbing ────────────────────────────────────────────────── */
const UI = {
  screenEl: null, topbarEl: null, toastEl: null,
  cleanup: null,

    this.screenEl = document.getElementById('screen');

  clear(crumb, hud) {

    Keys.clear();
    this.screenEl.innerHTML = '';

  },
  topbar(crumb, hud) {
    this.topbarEl.innerHTML = '';

    this.topbarEl.append(this.hudEl);
  },
  hud(html) { if (this.hudEl) this.hudEl.innerHTML = html; },
  toast(msg) {

    this.toastEl.append(t);
    setTimeout(() => t.remove(), 3200);
  },
  modal(html) {
    const veil = el('div', 'modal-veil');

    veil.append(box);
    document.body.append(veil);

  },
  results({ levelId, passed, rows, onRetry, onNext, failNote }) {
    Keys.clear();
    const gate = gateSummary(levelId);
    const rowsHtml = rows.map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('');
    const m = this.modal(
      `<h3 class="${passed ? 'pass' : 'fail'}">${passed ? '■ SHIFT CLEARED' : '■ NOT YET'}</h3>
       ${failNote ? `<div style="color:var(--red);font-size:13px;margin-bottom:8px">${esc(failNote)}</div>` : ''}
       <div class="statrows">${rowsHtml}</div>
       <div class="gate-note">Gate: ${esc(gate)}</div>
       <div class="acts"></div>`);
    const acts = m.box.querySelector('.acts');
    const retry = el('button', 'btn', 'Retry');
    retry.onclick = () => { m.close(); onRetry(); };
    const sel = el('button', 'btn', 'Level select');
    sel.onclick = () => { m.close(); Screens.levels(levelAt(levelId).stage); };
    acts.append(retry, sel);
    if (passed) {
      const nid = nextLevelId(levelId);
      const next = el('button', 'btn primary', nid ? `Next: ${nid} ▸` : 'Career complete!');
      next.onclick = () => { m.close(); if (nid) Screens.play(nid); else Screens.stages(); };
      acts.append(next);
      Sound.jingle();
    } else {
      Sound.buzz();
    }
  },
  // standard pre-level briefing overlay; host = positioned container
  briefing(host, title, lines, startLabel, onStart) {
    const veil = el('div', 'brief-veil');
    const box = el('div', 'briefing',
      `<h3>${esc(title)}</h3><ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul>`);
    const b = el('button', 'btn primary', startLabel || 'Start shift');
    b.onclick = () => { veil.remove(); onStart(); };
    box.append(b);
    veil.append(box);
    host.append(veil);
    setTimeout(() => b.focus(), 30);
  }
};
/* ════════════════════════════════════════════════════════════════
   GUIDE — the always-available live Corne board (ground rule 4).
   Shows the layer currently needed, highlights the exact next
   key(s), marks required thumb holds, labels GACS home-row mods.
   ════════════════════════════════════════════════════════════════ */
const Guide = {
  root: null, state: { layer: 0, needs: [], holds: [], text: 'Dvorak base layer' },
  init() {
    this.root = document.getElementById('guide');
    if (!Save.data.settings.guideOpen) this.root.classList.add('folded');
    this.render();
  },
  toggle() {
    this.root.classList.toggle('folded');
    Save.data.settings.guideOpen = !this.root.classList.contains('folded');
    Save.persist();
    this.render();
  },
  set(state) {
    this.state = Object.assign({ layer: 0, needs: [], holds: [], text: '' }, state);
    this.render();
  },
  idle(text) { this.set({ layer: 0, needs: [], holds: [], text: text || 'Dvorak base layer — GACS mods on A O E U · H T N S' }); },
  forChar(ch, label) {
    const h = KEY.hint(ch, label);
    if (!h) { this.idle(); return; }
    const holds = [];
    if (h.holdThumb) holds.push(h.holdThumb);
    if (h.shiftKey) holds.push(h.shiftKey);
    this.set({ layer: h.layer, needs: h.needs, holds, text: h.text });
  },
  forKeyName(k, label) { this.forChar(k, label); },
  // several keys on one layer (e.g. NAV mouse cluster, arrows)
  forCluster(layerIdx, keyNames, text) {
    const needs = [], holds = [];
    keyNames.forEach(k => { const h = KEY.hint(k); if (h) { needs.push(...h.needs); if (h.holdThumb && !holds.length) holds.push(h.holdThumb); } });
    this.set({ layer: layerIdx, needs, holds, text });
  },
  render() {
    const { layer, needs, holds, text } = this.state;
    const folded = this.root.classList.contains('folded');
    this.root.innerHTML = '';
    const head = el('div', 'g-head',
      `<span class="g-title">Corne guide</span>
       <span class="g-layer">LAYER ${layer} — ${esc(KEYMAP.layerNames[layer])}</span>
       <span class="g-hint">${esc(text)}</span>
       <span class="g-fold">${folded ? '▲ show' : '▼ hide'}</span>`);
    head.onclick = () => this.toggle();
    this.root.append(head);
    if (folded) return;

    const body = el('div', 'g-body');
    const L = KEYMAP.layers[layer];
    const hit = (list, side, row, col) => list.some(p => p.side === side && String(p.row) === String(row) && p.col === col);
    const mkKey = (cell, side, row, col, thumb) => {
      const k = el('div', 'key' + (thumb ? ' thumb' : ''));
      if (cell.blank) { k.classList.add('blank'); k.textContent = ''; return k; }
      if (cell.trans) { k.classList.add('transparent'); k.textContent = '▽'; return k; }
      k.append(el('span', null, esc(cell.l)));
      if (cell.sub) k.append(el('span', 'sub', esc(cell.sub)));
      if (cell.held) k.classList.add('hold');
      if (hit(needs, side, row, col)) k.classList.add('need');
      if (hit(holds, side, row, col)) k.classList.add('hold');
      return k;
    };
    const half = (side) => {
      const h = el('div', 'kb-half ' + (side === 'L' ? 'left' : 'right'));
      const rows = side === 'L' ? L.left : L.right;
      rows.forEach((r, ri) => {
        const rowEl = el('div', 'kb-row');
        r.forEach((c, ci) => rowEl.append(mkKey(c, side, ri, ci, false)));
        h.append(rowEl);
      });
      const th = el('div', 'kb-thumbs');
      (side === 'L' ? L.leftThumbs : L.rightThumbs).forEach((c, ci) => th.append(mkKey(c, side, 'T', ci, true)));
      h.append(th);
      return h;
    };
    body.append(half('L'), half('R'));
    this.root.append(body);
  }
};

/* ════════════════════════════════════════════════════════════════
   STAGE 1 — FLIGHT SCHOOL (Layer 0, Dvorak base)
   warm-up (untimed) → practice (scored) → test (gated)
   ════════════════════════════════════════════════════════════════ */
const Stage1 = {
  lv: null, def: null, phase: 'warmup',
  tokens: [], idx: 0, errors: 0, keystrokes: 0, t0: 0, wrongBuf: [],
  timer: null, textEl: null, run: false,

  taughtPool(uptoIdx) {
    let pool = [];
    for (let i = 0; i <= uptoIdx; i++) pool = pool.concat(CONFIG.stage1[i].newKeys.filter(k => k.length === 1));
    return pool;
  },

  /* ── token generation ─────────────────────────────────────────── */
  strToTokens(str) {
    const out = [];
    for (const ch of str) {
      if (ch === '\t') out.push({ key: 'Tab', label: '⇥ TAB' });
      else if (ch === '\x1b') out.push({ key: 'Escape', label: '⎋ ESC' });
      else if (ch === '\n') out.push({ key: 'Enter', label: '⏎' });
      else out.push({ ch });
    }
    return out;
  },
  generate(kind, chars) {
    const C = CONTENT;
    const words = (poolFn) => {
      let s = '';
      while (s.length < chars) s += (s ? ' ' : '') + poolFn();
      return this.strToTokens(s);
    };
    if (kind === 'bursts') {
      const L = ['a','o','e','u','i'], R = ['d','h','t','n','s'];
      let parts = shuffle(C.homeLetters).concat(shuffle(C.homeLetters));      // singles
      for (let i = 0; i < 10; i++) parts.push(pick(L) + pick(R), pick(R) + pick(L)); // alternating pairs
      let s = parts.join(' ');
      while (s.length < chars) {                                              // 3–5 key bursts
        let b = ''; const n = irnd(3, 5);
        for (let i = 0; i < n; i++) b += pick(C.homeLetters);
        s += ' ' + b;
      }
      return this.strToTokens(s.slice(0, chars + 6));
    }
    if (kind === 'homeWords') return words(() => pick(C.homeWords));
    if (kind === 'topWords') return words(() => {
      const r = Math.random();
      return r < 0.3 ? pick(C.homeWords) : r < 0.85 ? pick(C.topWords) : pick(C.topPunct);
    });
    if (kind === 'botWords') return words(() => {
      const r = Math.random();
      const w = r < 0.25 ? pick(C.homeWords) : r < 0.5 ? pick(C.topWords) : pick(C.botWords);
      return Math.random() < 0.12 ? w + ';' : w;
    });
    if (kind === 'pangrams') {
      let s = '';
      const bag = shuffle(C.pangrams);
      let i = 0;
      while (s.length < chars) s += (s ? ' ' : '') + bag[i++ % bag.length];
      return this.strToTokens(s);
    }
    // exam: prose lines with Tab/Esc tokens, Enter closing each line
    let toks = [];
    const bag = shuffle(C.examLines);
    let i = 0, count = 0;
    while (count < chars) {
      const line = bag[i++ % bag.length];
      const t = this.strToTokens(line);
      t.push({ key: 'Enter', label: '⏎' });
      toks = toks.concat(t);
      count += line.length + 1;
    }
    return toks;
  },
  warmupTokens() {
    const keys = this.def.newKeys.length ? this.def.newKeys
      : (this.lv.idx === 1 ? CONTENT.homeWords.slice(0, 8).join(' ').split('') : CONTENT.homeLetters);
    const out = [];
    keys.forEach(k => {
      for (let r = 0; r < 2; r++) {
        if (k.length === 1) out.push({ ch: k });
        else out.push({ key: k, label: k === 'Tab' ? '⇥ TAB' : k === 'Escape' ? '⎋ ESC' : k });
        out.push({ ch: ' ' });
      }
    });
    out.pop();
    return out;
  },

  /* ── screen ───────────────────────────────────────────────────── */
  start(lv) {
    this.lv = lv; this.def = lv.def;
    const s = UI.clear(`${lv.def.id} · ${lv.def.name.toUpperCase()}`);
    const w = el('div', 't-stage');
    w.append(el('h2', 'board', `${this.def.id} — ${this.def.name}`));
    w.append(el('div', 'subtle', `Gate: ${gateSummary(this.def.id)} · measured over the keys taught so far`));
    const phaseRow = el('div', 't-phase');
    ['warmup', 'practice', 'test'].forEach(p => {
      const b = el('button', 'btn', { warmup: 'Warm-up', practice: 'Practice run', test: 'Test run' }[p]);
      b.dataset.phase = p;
      b.onclick = () => this.begin(p);
      phaseRow.append(b);
    });
    const restart = el('button', 'btn', '↻ Restart');
    restart.onclick = () => this.begin(this.phase);
    phaseRow.append(restart);
    w.append(phaseRow);
    w.append(el('div', 't-meters',
      `<span>WPM <b id="m-wpm">–</b></span><span>ACC <b id="m-acc">–</b></span>
       <span>PROGRESS <b id="m-prog">0%</b></span><span id="m-phase" style="color:var(--amber)"></span>`));
    this.textEl = el('div', 't-text');
    w.append(this.textEl);
    w.append(el('div', 't-note', 'Errors buzz and hold the cursor. In strict levels (1-5+) wrong keys land in the buffer — fix them with Backspace (left thumb).'));
    s.append(w);
    UI.setCleanup(() => { clearInterval(this.timer); this.run = false; });
    this.begin('warmup');
  },

  begin(phase) {
    this.phase = phase;
    document.querySelectorAll('.t-phase .btn').forEach(b =>
      b.classList.toggle('on', b.dataset.phase === phase));
    const chars = phase === 'practice' ? Math.round(this.def.testChars * 0.6) : this.def.testChars;
    this.tokens = phase === 'warmup' ? this.warmupTokens() : this.generate(this.def.gen, chars);
    this.idx = 0; this.errors = 0; this.keystrokes = 0; this.t0 = 0; this.wrongBuf = []; this.run = true;
    document.getElementById('m-phase').textContent =
      { warmup: 'WARM-UP — untimed, follow the guide', practice: 'PRACTICE — scored, no gate', test: 'TEST — gate applies' }[phase];
    clearInterval(this.timer);
    this.timer = setInterval(() => this.meters(), 400);
    this.renderText();
    this.hint();
    Keys.set({ capture: true, onKey: (e) => this.onKey(e) });
  },

  hint() {
    const t = this.tokens[this.idx];
    if (!t) return;
    if (this.wrongBuf.length) { Guide.forKeyName('Backspace', 'Bsp'); return; }
    if (t.ch) Guide.forChar(t.ch === ' ' ? ' ' : t.ch, t.ch === ' ' ? 'Space' : undefined);
    else Guide.forKeyName(t.key);
  },

  onKey(e) {
    if (!this.run) return false;
    const k = e.key;
    if (['Shift','Control','Alt','Meta','CapsLock','NumLock'].includes(k)) return false;
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    const tok = this.tokens[this.idx];
    if (!tok) return false;

    if (this.def.strict && this.phase !== 'warmup') {
      if (k === 'Backspace') {
        if (this.wrongBuf.length) { this.wrongBuf.pop(); Sound.tick(); }
        this.renderText(); this.hint(); return true;
      }
      if (this.wrongBuf.length) {                       // buffer dirty: everything else piles on
        if (k.length === 1 || ['Tab','Enter','Escape'].includes(k)) {
          if (this.wrongBuf.length < 8) this.wrongBuf.push(k.length === 1 ? k : '⌧');
          this.errors++; this.keystrokes++; Sound.buzz();
          this.renderText(); this.meters();
        }
        return true;
      }
    }
    const want = tok.ch !== undefined ? tok.ch : tok.key;
    const got = tok.ch !== undefined ? (k.length === 1 ? k : null) : k;
    if (got === null && k !== 'Backspace' && !['Tab','Enter','Escape'].includes(k)) return false;
    if (!this.t0 && this.phase !== 'warmup') this.t0 = performance.now();
    this.keystrokes++;
    if (got === want) {
      this.idx++;
      Sound.tick();
      if (this.idx >= this.tokens.length) { this.finish(); return true; }
      this.renderText(); this.hint(); this.meters();
    } else {
      this.errors++;
      Sound.buzz();
      if (this.def.strict && this.phase !== 'warmup' && (k.length === 1 || ['Tab','Enter','Escape'].includes(k))) {
        this.wrongBuf.push(k.length === 1 ? k : '⌧');
      }
      this.renderText(); this.hint(); this.meters();
    }
    return true;
  },

  renderText() {
    const frag = document.createDocumentFragment();
    this.tokens.forEach((t, i) => {
      let cls = 'tok', body;
      if (t.ch !== undefined) {
        body = t.ch;
        if (i === this.idx && t.ch === ' ') body = '␣';
      } else { cls += ' special'; body = t.label || t.key; }
      if (i < this.idx) cls += ' done';
      if (i === this.idx && !this.wrongBuf.length) cls += ' cur';
      if (i === this.idx) {
        this.wrongBuf.forEach(wc => frag.append(el('span', 'tok wrongchar', esc(wc === ' ' ? '␣' : wc))));
        if (this.wrongBuf.length) cls += ' err';
      }
      frag.append(el('span', cls, esc(body)));
      if (t.key === 'Enter') frag.append(document.createTextNode('\n'));
    });
    this.textEl.innerHTML = '';
    this.textEl.append(frag);
    const cur = this.textEl.querySelector('.cur, .wrongchar');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  },

  stats() {
    const mins = this.t0 ? (performance.now() - this.t0) / 60000 : 0;
    const wpm = mins > 0 ? Math.round((this.idx / 5) / mins) : 0;
    const acc = this.keystrokes ? Math.round(100 * Math.max(0, this.keystrokes - this.errors) / this.keystrokes) : 100;
    return { wpm, acc, mins };
  },
  meters() {
    const { wpm, acc } = this.stats();
    const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
    set('m-wpm', this.phase === 'warmup' ? '–' : wpm);
    set('m-acc', acc + '%');
    set('m-prog', Math.round(100 * this.idx / this.tokens.length) + '%');
  },

  finish() {
    this.run = false;
    clearInterval(this.timer);
    Keys.clear();
    const { wpm, acc } = this.stats();
    if (this.phase === 'warmup') {
      Sound.good();
      UI.toast('Warm-up done — moving to the practice run.');
      this.begin('practice');
      return;
    }
    if (this.phase === 'practice') {
      Sound.good();
      UI.toast(`Practice: ${wpm} WPM @ ${acc}% — take the test when ready.`);
      this.begin('test');
      return;
    }
    const g = this.def.gate;
    const passed = wpm >= g.wpm && acc >= g.acc;
    Save.record(this.def.id, passed, { wpm, acc }, 'wpm', false);
    UI.results({
      levelId: this.def.id, passed,
      rows: [['Speed', wpm + ' WPM'], ['Accuracy', acc + '%'], ['Errors', this.errors], ['Keystrokes', this.keystrokes]],
      onRetry: () => this.begin('test')
    });
  }
};
