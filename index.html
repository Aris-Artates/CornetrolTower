/* ════════════════════════════════════════════════════════════════
   STAGE 2 — SECURITY CHECKPOINT (Layer 1 NAV & mouse + Layer 0)
   Real OS pointer (firmware mouse keys) tags contraband; names are
   typed on the base layer; containers drill the NAV arrow cluster;
   Ctrl+Z (NAV Undo) reverts mistags.
   ════════════════════════════════════════════════════════════════ */
const Stage2 = {
  def: null, lv: null,
  bags: [], queue: [], monitor: null, reportBar: null,
  raf: 0, lastT: 0, running: false, paused: false,
  timeLeft: 0, falseTags: 0, undoStack: [],
  redsTotal: 0, redsFiled: 0, nameKeys: 0, nameChars: 0,
  panelStack: [], report: null, bagsDone: 0, t0: 0,

  /* ── generation ──────────────────────────────────────────────── */
  makeItem(spec, red, container) {
    return { name: spec.name, glyph: spec.glyph, red, container: !!container,
             contents: [], filed: false, falseTagged: false, opened: false };
  },
  redPool() {
    const X = CONTENT.xray;
    return this.def.pool === 'long' ? X.redShort.concat(X.redLong) : X.redShort;
  },
  makeContainer(depth) {
    const X = CONTENT.xray;
    const c = this.makeItem(pick(X.containers), true, true);
    const n = irnd(3, 4);
    c.contents.push(this.makeItem(pick(this.redPool()), true));
    for (let i = 1; i < n; i++) {
      if (depth > 1 && i === 1 && Math.random() < 0.5) c.contents.push(this.makeContainer(depth - 1));
      else if (Math.random() < 0.35) c.contents.push(this.makeItem(pick(this.redPool()), true));
      else c.contents.push(this.makeItem(pick(X.safe), false));
    }
    c.contents = shuffle(c.contents);
    return c;
  },
  makeBag(i) {
    const X = CONTENT.xray;
    const items = [];
    const n = irnd(this.def.itemsPerBag[0], this.def.itemsPerBag[1]);
    const wantContainer = this.def.containerDepth > 0 && (i % 3 === 1);
    if (wantContainer) items.push(this.makeContainer(this.def.containerDepth));
    else {
      items.push(this.makeItem(pick(this.redPool()), true));
      if (this.lv.idx >= 1 && Math.random() < 0.35) items.push(this.makeItem(pick(this.redPool()), true));
    }
    while (items.length < n) {
      const safePool = this.def.lookalikes && Math.random() < 0.4 ? X.lookalikeSafe : X.safe;
      items.push(this.makeItem(pick(safePool), false));
    }
    const w = 150 + items.length * 34;
    return { items: shuffle(items), w, h: 128, x: 0, spawned: false, resolved: false, dom: null };
  },
  countReds(items) {
    let n = 0;
    items.forEach(it => { if (it.container) n += this.countReds(it.contents); else if (it.red) n++; });
    return n;
  },
  unfiledReds(items) {
    let n = 0;
    items.forEach(it => { if (it.container) n += this.unfiledReds(it.contents); else if (it.red && !it.filed) n++; });
    return n;
  },

  /* ── screen ──────────────────────────────────────────────────── */
  start(lv) {
    this.lv = lv; this.def = lv.def;
    const s = UI.clear(`${lv.def.id} · SECURITY CHECKPOINT`);
    const w = el('div', 'xr-wrap');
    w.append(el('div', 'xr-hud',
      `<span>BAGS <b id="x-bags">0/0</b></span><span>REDS <b id="x-reds">0/0</b></span>
       <span>FALSE <b id="x-false">0</b>/${this.def.maxFalse}</span>
       <span>NAMES <b id="x-nacc">100%</b></span><span>SHIFT <b id="x-time">–</b></span>`));
    this.monitor = el('div', 'xr-monitor');
    this.monitor.append(el('div', 'xr-belt'));
    w.append(this.monitor);
    this.reportBar = el('div', 'xr-report');
    this.reportBar.style.display = 'none';
    w.append(this.reportBar);
    s.append(w);

    this.bags = []; this.queue = [];
    for (let i = 0; i < this.def.bags; i++) this.queue.push(this.makeBag(i));
    this.redsTotal = this.queue.reduce((a, b) => a + this.countReds(b.items), 0);
    this.redsFiled = 0; this.falseTags = 0; this.undoStack = [];
    this.nameKeys = 0; this.nameChars = 0; this.bagsDone = 0;
    this.timeLeft = this.def.time; this.panelStack = []; this.report = null;
    this.running = false; this.paused = false;

    UI.setCleanup(() => { cancelAnimationFrame(this.raf); this.running = false; });
    this.guideBelt();
    UI.briefing(this.monitor, `Shift briefing — ${this.def.id} ${this.def.name}`, [
      'Bags cross the X-ray. <b>▲ red silhouettes are contraband</b>, ● white ones are safe.',
      'Hold <kbd>NAV</kbd> (left thumb) and steer the cursor with the mouse keys; <kbd>LC</kbd> left-clicks a red item to tag it.',
      'Tagging opens the report bar — type the item\'s exact name and press <kbd>Enter</kbd>.',
      'Red <b>containers</b> open an inspection panel: <kbd>↑</kbd>/<kbd>↓</kbd> (NAV on T/N) to move, <kbd>Enter</kbd> to report, <kbd>Esc</kbd> to close.',
      'Mistagged a safe item? <kbd>NAV</kbd>+<kbd>Undo</kbd> (Ctrl+Z) reverts it.',
      `Quota: ${this.def.bags} bags · every red reported · ≤${this.def.maxFalse} false tags.`
    ], 'Start shift', () => this.go());
  },

  go() {
    this.running = true;
    this.t0 = performance.now();
    this.lastT = this.t0;
    Keys.set({ capture: true, onKey: (e, editable) => this.onKey(e, editable) });
    const loop = (t) => {
      if (!this.running) return;
      const dt = Math.min(0.1, (t - this.lastT) / 1000);
      this.lastT = t;
      this.tickBelt(dt);
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.fail('The shift timer ran out.'); return; }
      this.hud();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  hud() {
    const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
    set('x-bags', `${this.bagsDone}/${this.def.bags}`);
    set('x-reds', `${this.redsFiled}/${this.redsTotal}`);
    set('x-false', this.falseTags);
    set('x-nacc', this.nameAcc() + '%');
    set('x-time', fmtTime(this.timeLeft));
  },
  nameAcc() { return this.nameKeys ? Math.min(100, Math.round(100 * this.nameChars / this.nameKeys)) : 100; },

  /* ── belt ────────────────────────────────────────────────────── */
  tickBelt(dt) {
    if (this.paused) return;
    const W = this.monitor.clientWidth;
    // spawn next bag when there is room
    const last = this.bags[this.bags.length - 1];
    if (this.queue.length && (!last || last.x + last.w < W - 70)) {
      const b = this.queue.shift();
      b.x = W + 10;
      this.spawnBag(b);
      this.bags.push(b);
    }
    for (const b of this.bags) {
      if (b.resolved) continue;
      b.x -= this.def.beltSpeed * dt;
      b.dom.style.left = b.x + 'px';
      if (b.x + b.w < -8) {
        b.resolved = true;
        this.bagsDone++;
        b.dom.remove();
        const missed = this.unfiledReds(b.items);
        if (missed > 0) { this.fail(`A red item slipped through in that bag (${missed} unreported).`); return; }
        if (this.bagsDone >= this.def.bags) { this.finish(); return; }
      }
    }
  },
  spawnBag(bag) {
    const beltTop = this.monitor.clientHeight - 26;
    const d = el('div', 'bag');
    d.style.width = bag.w + 'px'; d.style.height = bag.h + 'px';
    d.style.top = (beltTop - bag.h - 2) + 'px'; d.style.left = bag.x + 'px';
    d.append(el('div', 'bagtag', 'BAG ' + irnd(100, 999)));
    const cols = bag.items.length;
    bag.items.forEach((it, i) => {
      const x = 10 + i * ((bag.w - 46) / Math.max(1, cols - 1) || 0);
      const y = 18 + (i % 2) * 44 + irnd(-6, 6);
      d.append(this.itemDom(it, x, Math.min(y, bag.h - 52)));
    });
    bag.dom = d;
    this.monitor.append(d);
  },
  itemDom(it, x, y) {
    const d = el('div', 'xitem ' + (it.red ? 'red' : 'safe'),
      `<span class="glyph">${it.glyph}</span><span class="badge">${it.red ? '▲' : '●'}</span>`);
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.onclick = (ev) => { ev.stopPropagation(); this.clickItem(it, d); };
    it.dom = d;
    return d;
  },

  /* ── tagging & reports ───────────────────────────────────────── */
  clickItem(it, dom) {
    if (!this.running || this.report || this.panelStack.length) return;
    if (it.filed || it.falseTagged) return;
    if (!it.red) {
      it.falseTagged = true;
      dom.classList.add('falsetag');
      this.falseTags++;
      this.undoStack.push(it);
      Sound.buzz();
      Guide.forKeyName('Undo');
      UI.toast('False alarm! NAV + Undo (Ctrl+Z) reverts it.');
      return;
    }
    Sound.blip();
    if (it.container) { it.opened = true; this.openPanel(it); return; }
    this.openReport(it);
  },
  undo() {
    const it = this.undoStack.pop();
    if (!it) return;
    it.falseTagged = false;
    if (it.dom) it.dom.classList.remove('falsetag');
    this.falseTags--;
    Sound.good();
    UI.toast('Mistag reverted.');
    this.guideBelt();
  },

  openReport(it) {
    this.paused = true;
    this.report = { item: it };
    this.reportBar.style.display = 'flex';
    this.reportBar.innerHTML = `<span style="color:var(--red)">▲ REPORT:</span>
      <span>${it.glyph}</span><input type="text" spellcheck="false" autocomplete="off">
      <span class="subtle" style="font-size:12px">type the exact name · Enter files · Esc cancels</span>`;
    const inp = this.reportBar.querySelector('input');
    inp.addEventListener('keydown', (e) => {
      if (e.key.length === 1 || e.key === 'Backspace') this.nameKeys++;
    });
    inp.addEventListener('input', () => this.guideName(it.name, inp.value));
    inp.focus();
    this.guideName(it.name, '');
  },
  submitReport() {
    const inp = this.reportBar.querySelector('input');
    const it = this.report.item;
    if (inp.value.trim().toLowerCase() === it.name.toLowerCase()) {
      it.filed = true;
      this.nameChars += it.name.length;
      if (it.dom) it.dom.classList.add('tagged');
      this.redsFiled++;
      Sound.good();
      this.closeReport();
    } else { Sound.buzz(); inp.select(); }
  },
  closeReport() {
    this.report = null;
    this.reportBar.style.display = 'none';
    this.paused = this.panelStack.length > 0;
    this.guideBelt();
  },

  /* ── container inspection panel ──────────────────────────────── */
  openPanel(container) {
    this.paused = true;
    const p = { container, sel: 0, typing: null, dom: null };
    this.panelStack.push(p);
    this.renderPanel();
    this.guidePanel();
  },
  topPanel() { return this.panelStack[this.panelStack.length - 1]; },
  renderPanel() {
    this.panelStack.forEach(p => { if (p.dom) p.dom.remove(); });
    const p = this.topPanel();
    if (!p) return;
    const c = p.container;
    const d = el('div', 'xr-panel');
    d.append(el('h4', null, `${c.glyph} ${esc(c.name)} — contents`));
    c.contents.forEach((it, i) => {
      const cls = ['entry', it.red ? 'redE' : 'safeE', it.filed ? 'doneE' : '', i === p.sel ? 'sel' : ''].join(' ');
      const e = el('div', cls,
        `<span class="eglyph">${it.glyph}</span><span>${it.red ? '▲' : '●'}</span>
         <span class="ename">${esc(it.name)}${it.container ? ' (container)' : ''}</span>`);
      if (i === p.sel && p.typing !== null) {
        const inp = el('input');
        inp.type = 'text'; inp.spellcheck = false;
        inp.value = p.typing;
        e.append(inp);
        setTimeout(() => { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 0);
        inp.addEventListener('keydown', (ev) => {
          if (ev.key.length === 1 || ev.key === 'Backspace') this.nameKeys++;
        });
        inp.addEventListener('input', () => { p.typing = inp.value; this.guideName(it.name, inp.value); });
      }
      d.append(e);
    });
    d.append(el('div', 'phint', '↑/↓ move (NAV on T/N) · Enter report red · Esc close'));
    p.dom = d;
    this.monitor.append(d);
  },
  panelKey(e) {
    const p = this.topPanel();
    const c = p.container;
    const it = c.contents[p.sel];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (p.typing !== null) return true;   // finish or Esc the name first
      p.sel = (p.sel + (e.key === 'ArrowDown' ? 1 : c.contents.length - 1)) % c.contents.length;
      Sound.blip();
      this.renderPanel(); this.guidePanel();
      return true;
    }
    if (e.key === 'Enter') {
      if (p.typing !== null) {              // submit typed name
        if (p.typing.trim().toLowerCase() === it.name.toLowerCase()) {
          it.filed = true;
          this.nameChars += it.name.length;
          this.redsFiled++;
          p.typing = null;
          Sound.good();
        } else Sound.buzz();
        this.renderPanel(); this.guidePanel();
        return true;
      }
      if (it.container && !it.filed) { it.opened = true; Sound.blip(); this.openPanel(it); return true; }
      if (it.red && !it.filed) { p.typing = ''; this.renderPanel(); this.guideName(it.name, ''); return true; }
      Sound.buzz();                          // white entry: skip it
      return true;
    }
    if (e.key === 'Escape') {
      if (p.typing !== null) { p.typing = null; this.renderPanel(); this.guidePanel(); return true; }
      p.dom.remove();
      this.panelStack.pop();
      if (this.panelStack.length) { this.renderPanel(); this.guidePanel(); }
      else { this.paused = !!this.report; this.guideBelt(); }
      Sound.blip();
      return true;
    }
    return false;
  },

  /* ── input ───────────────────────────────────────────────────── */
  onKey(e, editable) {
    if (!this.running) return false;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' || e.key === 'Undo') {
      if (!this.report && !this.panelStack.length) { this.undo(); return true; }
      return true;   // swallow while a form is open
    }
    if (this.panelStack.length) return this.panelKey(e);
    if (this.report) {
      if (e.key === 'Enter') { this.submitReport(); return true; }
      if (e.key === 'Escape') { this.closeReport(); return true; }
      return false;  // let chars flow into the input
    }
    return false;
  },

  /* ── guide states ────────────────────────────────────────────── */
  guideBelt() {
    Guide.forCluster(1, ['MU', 'MD', 'ML', 'MR', 'LC'],
      'Hold NAV (left thumb) · MU/MD/ML/MR steer the cursor · LC (left click) tags a ▲ red item');
  },
  guidePanel() {
    Guide.forCluster(1, ['ArrowUp', 'ArrowDown'],
      'Hold NAV · ↑/↓ on T & N move the list · Enter reports a ▲ entry · Esc closes');
  },
  guideName(target, typed) {
    let i = 0;
    while (i < typed.length && i < target.length && typed[i] === target[i]) i++;
    if (typed === target) Guide.forKeyName('Enter', 'Ent — file the report');
    else if (i < typed.length) Guide.forKeyName('Backspace', 'Bsp — fix the name');
    else Guide.forChar(target[i], target[i] === ' ' ? 'Space' : undefined);
  },

  /* ── endings ─────────────────────────────────────────────────── */
  elapsed() { return (performance.now() - this.t0) / 1000; },
  fail(note) {
    this.running = false;
    cancelAnimationFrame(this.raf);
    Save.record(this.def.id, false, null, 'time', true);
    UI.results({
      levelId: this.def.id, passed: false, failNote: note,
      rows: [['Bags cleared', `${this.bagsDone}/${this.def.bags}`], ['Reds reported', `${this.redsFiled}/${this.redsTotal}`],
             ['False tags', this.falseTags], ['Name accuracy', this.nameAcc() + '%']],
      onRetry: () => this.start(this.lv)
    });
  },
  finish() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    const time = this.elapsed();
    const nameAcc = this.nameAcc();
    const passed = this.falseTags <= this.def.maxFalse && nameAcc >= this.def.nameAcc;
    const stats = { time: Math.round(time), falseTags: this.falseTags, nameAcc };
    Save.record(this.def.id, passed, stats, 'time', true);
    UI.results({
      levelId: this.def.id, passed,
      failNote: passed ? null : (this.falseTags > this.def.maxFalse ? 'Too many false tags.' : 'Item names typed too sloppily.'),
      rows: [['Shift time', fmtTime(time)], ['Reds reported', `${this.redsFiled}/${this.redsTotal}`],
             ['False tags', `${this.falseTags} (max ${this.def.maxFalse})`], ['Name accuracy', `${nameAcc}% (min ${this.def.nameAcc}%)`]],
      onRetry: () => this.start(this.lv)
    });
  }
};
/* ════════════════════════════════════════════════════════════════
   STAGE 3 — MAINTENANCE BAY (Layer 2 SYM + Layers 0 & 1)
   Mini fake IDE: file tree, tabbed panes, live char-diff against
   the ticket target, and a fake terminal. Nothing executes —
   correctness is buffer vs target.
   ════════════════════════════════════════════════════════════════ */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}

const Stage3 = {
  lv: null, def: null, content: null,
  filesState: {}, panes: [], zone: 0, ticketIdx: 0,
  termNeeded: [], termProgress: 0,
  keystrokes: 0, corrections: 0, minSum: 0,
  fpGood: 0, fpBad: 0, lineTouched: {}, lineEvaluated: {},
  timeLeft: 0, timer: null, running: false,
  treeEl: null, centerEl: null, ticketEl: null, targetEl: null, termOut: null, termIn: null,

  norm(s) { return s.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, ''); },
  ticket() { return this.content.tickets[this.ticketIdx] || null; },

  start(lv) {
    this.lv = lv; this.def = lv.def;
    this.content = TICKETS[this.def.id];
    this.filesState = { ...this.content.files };
    this.panes = []; this.zone = 0; this.ticketIdx = 0;
    this.keystrokes = 0; this.corrections = 0; this.minSum = 0;
    this.fpGood = 0; this.fpBad = 0;
    this.timeLeft = this.def.time; this.running = false;

    const s = UI.clear(`${this.def.id} · MAINTENANCE BAY`);
    const grid = el('div', 'ide');
    this.treeEl = el('div', 'tree');
    this.centerEl = el('div', 'center');
    const tcol = el('div', 'ticketcol');
    this.ticketEl = el('div', 'ticket');
    this.targetEl = el('div', 'targetview');
    tcol.append(this.ticketEl, this.targetEl);
    const term = el('div', 'term');
    this.termOut = el('div', 'tout', 'MAINT-BAY OS — fake terminal. PgDn cycles pane → terminal.\n');
    const tline = el('div', 'tline', '<span style="color:var(--green)">$</span>');
    this.termIn = el('input');
    this.termIn.spellcheck = false;
    tline.append(this.termIn);
    term.append(this.termOut, tline);
    this.termEl = term;
    grid.append(this.treeEl, this.centerEl, tcol, term);
    s.append(grid);

    this.addPane();
    this.renderTree();

    this.termIn.addEventListener('keydown', (e) => {
      this.countKey(e);
      if (e.key === 'Enter') { this.runCmd(this.termIn.value); this.termIn.value = ''; e.preventDefault(); }
    });
    this.termIn.addEventListener('input', () => this.guideTerminal());
    this.termIn.addEventListener('focus', () => this.setZone(this.panes.length));

    UI.setCleanup(() => { clearInterval(this.timer); this.running = false; });
    UI.briefing(s, `Work order — ${this.def.id} ${this.def.name}`, [
      'Reproduce each ticket\'s target code <b>exactly</b> — mismatching lines glow red in your buffer.',
      'Hold <kbd>SYM</kbd> (right thumb) for symbols: openers <kbd>( { [</kbd> sit on the LEFT home row, closers <kbd>) } ]</kbd> mirror on the RIGHT.',
      'Select with home-row-mod Shift (<kbd>U</kbd>/<kbd>H</kbd>) + NAV arrows / Home / End. Copy, Cut, Paste and Undo live on the NAV layer.',
      '<kbd>PgUp</kbd>/<kbd>PgDn</kbd> (NAV) cycle pane → split → terminal. Click works too. <kbd>Tab</kbd> indents 4 spaces.',
      `Timer: ${fmtTime(this.def.time)} · first-pass line accuracy gate: ${this.def.firstPass}%.`
    ], 'Clock in', () => {
      this.running = true;
      Keys.set({ capture: true, onKey: (e, ed) => this.onKey(e, ed) });
      this.timer = setInterval(() => {
        this.timeLeft -= 0.5;
        if (this.timeLeft <= 0) this.fail('The shift timer ran out.');
        this.hud();
      }, 500);
      this.setTicket(0);
    });
  },

  /* ── panes & files ───────────────────────────────────────────── */
  addPane() {
    const idx = this.panes.length;
    const dom = el('div', 'pane');
    const tabsEl = el('div', 'tabs');
    const wrap = el('div', 'edwrap');
    const pre = el('pre');
    const ta = document.createElement('textarea');
    ta.spellcheck = false; ta.wrap = 'off';
    wrap.append(pre, ta);
    dom.append(tabsEl, wrap);
    this.centerEl.append(dom);
    const pane = { idx, dom, tabsEl, ta, pre, tabs: [], active: null, lastLine: null };
    this.panes.push(pane);

    ta.addEventListener('keydown', (e) => {
      this.countKey(e);
      if (e.key === 'Tab') {
        e.preventDefault();
        if (!document.execCommand('insertText', false, '    ')) {
          const st = ta.selectionStart;
          ta.value = ta.value.slice(0, st) + '    ' + ta.value.slice(ta.selectionEnd);
          ta.setSelectionRange(st + 4, st + 4);
          ta.dispatchEvent(new Event('input'));
        }
      }
    });
    ta.addEventListener('input', () => {
      if (!pane.active) { ta.value = ''; return; }
      this.filesState[pane.active] = ta.value;
      const line = this.caretLine(ta);
      this.lineTouched[pane.active + ':' + line] = true;
      this.renderDiff(pane);
      this.guideDiff();
      this.checkTicket();
    });
    const caretWatch = () => this.trackCaret(pane);
    ta.addEventListener('keyup', caretWatch);
    ta.addEventListener('click', caretWatch);
    ta.addEventListener('focus', () => this.setZone(idx));
    ta.addEventListener('scroll', () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
    this.renderTabs(pane);
    return pane;
  },
  caretLine(ta) { return ta.value.slice(0, ta.selectionStart).split('\n').length - 1; },
  trackCaret(pane) {
    if (!pane.active) return;
    const line = this.caretLine(pane.ta);
    if (pane.lastLine !== null && line !== pane.lastLine) this.evalLine(pane, pane.lastLine);
    pane.lastLine = line;
  },
  evalLine(pane, lineNo) {
    const t = this.ticket();
    if (!t || !t.file || pane.active !== t.file) return;
    const key = pane.active + ':' + lineNo;
    if (!this.lineTouched[key] || this.lineEvaluated[key]) return;
    this.lineEvaluated[key] = true;
    const cur = (this.filesState[pane.active] || '').split('\n')[lineNo] || '';
    const tgt = t.after.split('\n')[lineNo];
    if (tgt !== undefined && cur.replace(/\s+$/, '') === tgt.replace(/\s+$/, '')) this.fpGood++;
    else this.fpBad++;
    this.hud();
  },
  openFile(name, paneIdx) {
    const pane = this.panes[paneIdx === undefined ? Math.min(this.zone, this.panes.length - 1) : paneIdx];
    if (!pane.tabs.includes(name)) pane.tabs.push(name);
    pane.active = name;
    pane.ta.value = this.filesState[name];
    pane.lastLine = null;
    this.renderTabs(pane);
    this.renderTree();
    this.renderDiff(pane);
  },
  renderTabs(pane) {
    pane.tabsEl.innerHTML = '';
    if (!pane.tabs.length) pane.tabsEl.append(el('span', 'tab', 'no file — click one in the tree'));
    pane.tabs.forEach(name => {
      const t = el('span', 'tab' + (pane.active === name ? ' on' : ''), esc(name));
      t.onclick = () => { this.setZone(pane.idx); this.openFile(name, pane.idx); pane.ta.focus(); };
      pane.tabsEl.append(t);
    });
  },
  renderTree() {
    this.treeEl.innerHTML = '<div style="color:var(--amber);letter-spacing:.15em;font-size:11px;margin-bottom:6px">FILES</div>';
    Object.keys(this.filesState).forEach(name => {
      const open = this.panes.some(p => p.active === name);
      const f = el('div', 'fitem' + (open ? ' open' : ''), '▸ ' + esc(name));
      f.onclick = () => { this.openFile(name); this.panes[Math.min(this.zone, this.panes.length - 1)].ta.focus(); };
      this.treeEl.append(f);
    });
    if (this.panes.length < 2) {
      const b = el('button', 'btn', '⫶ Split pane');
      b.style.cssText = 'margin-top:12px;font-size:11px;padding:4px 10px';
      b.onclick = () => { this.addPane(); this.renderTree(); };
      this.treeEl.append(b);
    }
  },
  setZone(z) {
    this.zone = z;
    this.panes.forEach((p, i) => p.dom.classList.toggle('activePane', i === z));
    this.termEl.classList.toggle('activePane', z === this.panes.length);
  },
  cycleZone(dir) {
    const count = this.panes.length + 1;   // panes + terminal
    const z = ((this.zone + dir) % count + count) % count;
    this.setZone(z);
    if (z < this.panes.length) this.panes[z].ta.focus(); else this.termIn.focus();
  },

  /* ── diff rendering ──────────────────────────────────────────── */
  renderDiff(pane) {
    const t = this.ticket();
    const text = pane.active ? this.filesState[pane.active] : '';
    if (!t || !t.file || pane.active !== t.file) {
      pane.pre.innerHTML = esc(text) + '\n';
      return;
    }
    const cur = text.split('\n'), tgt = t.after.split('\n');
    pane.pre.innerHTML = cur.map((l, i) => {
      const ok = tgt[i] !== undefined && l.replace(/\s+$/, '') === tgt[i].replace(/\s+$/, '');
      const extra = i >= tgt.length && l.trim() === '';
      return `<span class="${ok || extra ? 'ok' : 'bad'}">${esc(l) || ' '}</span>`;
    }).join('\n') + '\n';
  },

  /* ── tickets ─────────────────────────────────────────────────── */
  setTicket(i) {
    this.ticketIdx = i;
    if (i >= this.content.tickets.length) { this.finish(); return; }
    const t = this.ticket();
    this.termNeeded = t.terminal ? t.terminal.slice() : [];
    this.termProgress = 0;
    this.lineTouched = {}; this.lineEvaluated = {};
    if (t.file) {
      this.minSum += levenshtein(this.filesState[t.file], t.after);
      this.openFile(t.file, 0);
      this.setZone(0);
      this.panes[0].ta.focus();
    } else {
      this.setZone(this.panes.length);
      this.termIn.focus();
    }
    if (t.split && this.panes.length < 2) { this.addPane(); this.renderTree(); }
    this.ticketEl.innerHTML =
      `<div class="tid">Ticket ${i + 1}/${this.content.tickets.length} — ${esc(t.title)}</div>
       <div class="brief">${esc(t.brief)}</div>`;
    this.targetEl.innerHTML = t.file
      ? `<div class="tv-head">TARGET — ${esc(t.file)}</div><pre>${esc(t.after)}</pre>`
      : `<div class="tv-head">TARGET — terminal</div><pre>${t.terminal.map(c => '$ ' + esc(c)).join('\n')}</pre>`;
    this.panes.forEach(p => this.renderDiff(p));
    this.guideDiff();
    this.hud();
  },
  checkTicket() {
    const t = this.ticket();
    if (!t || !t.file) return;
    if (this.norm(this.filesState[t.file]) === this.norm(t.after) && this.termProgress >= this.termNeeded.length) {
      // any touched-but-unleft lines match by definition now
      Object.keys(this.lineTouched).forEach(k => { if (!this.lineEvaluated[k]) { this.lineEvaluated[k] = true; this.fpGood++; } });
      Sound.good();
      UI.toast(`Ticket closed: ${t.title}`);
      this.setTicket(this.ticketIdx + 1);
    }
  },
  runCmd(raw) {
    const cmd = raw.trim();
    if (!cmd) return;
    this.termOut.textContent += '$ ' + cmd + '\n';
    const t = this.ticket();
    const expected = this.termNeeded[this.termProgress];
    if (t && expected && cmd === expected) {
      this.termProgress++;
      this.termOut.textContent += `  ✔ ${expected.split(' ')[0]} acknowledged\n`;
      Sound.good();
      if (this.termProgress >= this.termNeeded.length) {
        if (!t.file) { Sound.jingle(); UI.toast(`Ticket closed: ${t.title}`); this.setTicket(this.ticketIdx + 1); }
        else this.checkTicket();
      } else this.guideTerminal();
    } else {
      this.termOut.textContent += expected ? `  ✘ expected: ${expected}\n` : '  unknown command\n';
      Sound.buzz();
    }
    this.termOut.scrollTop = this.termOut.scrollHeight;
  },

  /* ── input & stats ───────────────────────────────────────────── */
  countKey(e) {
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key) || /^F\d{1,2}$/.test(e.key)) return;
    this.keystrokes++;
    if (e.key === 'Backspace' || e.key === 'Delete') this.corrections++;
  },
  onKey(e) {
    if (!this.running) return false;
    if (e.key === 'PageDown') { this.cycleZone(1); return true; }
    if (e.key === 'PageUp') { this.cycleZone(-1); return true; }
    if (e.key === 'Escape') return true;
    return false;   // native editing (incl. Ctrl+C/X/V/Z/Y) stays untouched
  },
  fp() { const n = this.fpGood + this.fpBad; return n ? Math.round(100 * this.fpGood / n) : 100; },
  hud() {
    UI.hud(`<span>TICKET <b>${Math.min(this.ticketIdx + 1, this.content.tickets.length)}/${this.content.tickets.length}</b></span>
      <span>TIME <b>${fmtTime(this.timeLeft)}</b></span>
      <span>KEYS <b>+${Math.max(0, this.keystrokes - this.minSum)}</b> over min</span>
      <span>FIRST-PASS <b>${this.fp()}%</b></span>`);
  },

  /* ── guide ───────────────────────────────────────────────────── */
  guideDiff() {
    const t = this.ticket();
    if (!t || !t.file) { this.guideTerminal(); return; }
    const cur = this.norm(this.filesState[t.file] || ''), tgt = this.norm(t.after);
    if (cur === tgt) { Guide.idle('Buffer matches — ticket closing…'); return; }
    let i = 0;
    while (i < cur.length && i < tgt.length && cur[i] === tgt[i]) i++;
    if (i >= tgt.length || (cur.length > tgt.length && cur.slice(0, i) === tgt.slice(0, i) && i === tgt.length)) {
      Guide.forKeyName('Backspace', 'Bsp — trim the extra text'); return;
    }
    const ch = tgt[i];
    if (ch === '\n') Guide.forKeyName('Enter');
    else Guide.forChar(ch, ch === ' ' ? 'Space' : undefined);
  },
  guideTerminal() {
    const expected = this.termNeeded[this.termProgress];
    if (!expected) { Guide.idle(); return; }
    const typed = this.termIn.value;
    let i = 0;
    while (i < typed.length && i < expected.length && typed[i] === expected[i]) i++;
    if (typed === expected) Guide.forKeyName('Enter', 'Ent — run it');
    else if (i < typed.length) Guide.forKeyName('Backspace', 'Bsp — fix the command');
    else Guide.forChar(expected[i], expected[i] === ' ' ? 'Space' : undefined);
  },

  /* ── endings ─────────────────────────────────────────────────── */
  fail(note) {
    if (!this.running) return;
    this.running = false;
    clearInterval(this.timer);
    Save.record(this.def.id, false, null, 'time', true);
    UI.results({
      levelId: this.def.id, passed: false, failNote: note,
      rows: [['Tickets closed', `${this.ticketIdx}/${this.content.tickets.length}`],
             ['First-pass lines', this.fp() + '%'], ['Keystrokes over min', '+' + Math.max(0, this.keystrokes - this.minSum)]],
      onRetry: () => this.start(this.lv)
    });
  },
  finish() {
    this.running = false;
    clearInterval(this.timer);
    const time = this.def.time - this.timeLeft;
    const fp = this.fp();
    const over = Math.max(0, this.keystrokes - this.minSum);
    const passed = fp >= this.def.firstPass;
    Save.record(this.def.id, passed, { time: Math.round(time), over, fp }, 'time', true);
    UI.results({
      levelId: this.def.id, passed,
      failNote: passed ? null : 'Too many lines needed a second pass.',
      rows: [['Time', fmtTime(time)], ['Tickets', `${this.content.tickets.length}/${this.content.tickets.length}`],
             ['First-pass lines', `${fp}% (min ${this.def.firstPass}%)`],
             ['Keystrokes over min', '+' + over]],
      onRetry: () => this.start(this.lv)
    });
  }
};
/* ════════════════════════════════════════════════════════════════
   STAGE 4 — CORNE-TROLL TOWER (Layer 3 FN)
   F-key tags select inbound planes, Tab cycles duplicates,
   Enter clears the closest one to land. Optional FN-numpad
   heading prompts in 4-4/4-5.
   ════════════════════════════════════════════════════════════════ */
const Stage4 = {
  lv: null, def: null,
  field: null, msgEl: null, npEl: null,
  planes: [], landed: 0, wrongSel: 0, spawnClock: 0, planeSeq: 0,
  sel: null,               // { tag, idx }
  runwayBusy: false, numpad: null,   // { plane, code, typed }
  raf: 0, lastT: 0, running: false, t0: 0, lastGuideKey: '',

  AIRLINES: ['DAL', 'UAL', 'AAL', 'SWA', 'JBU', 'KLM', 'ANA', 'QFA', 'PAL', 'CEB'],

  start(lv) {
    this.lv = lv; this.def = lv.def;
    const s = UI.clear(`${lv.def.id} · CORNE-TROLL TOWER`);
    const w = el('div', 'tw-wrap');
    w.append(el('div', 'tw-hud',
      `<span>LANDED <b id="t-land">0/${this.def.land}</b></span>
       <span>WRONG <b id="t-wrong">0</b>/${this.def.maxWrong}</span>
       <span>AIRBORNE <b id="t-air">0</b></span>
       <span>TIME <b id="t-time">0:00</b></span>`));
    this.field = el('div', 'radar');
    [140, 280, 430].forEach(r => {
      const ring = el('div', 'ring');
      ring.style.cssText = `width:${r * 2}px;height:${r * 2}px;left:calc(50% - ${r}px);bottom:${60 - r}px`;
      this.field.append(ring);
    });
    this.runwayEl = el('div', 'runway');
    this.field.append(this.runwayEl);
    this.msgEl = el('div', 'tw-msg');
    this.msgEl.style.display = 'none';
    this.field.append(this.msgEl);
    w.append(this.field);
    s.append(w);

    this.planes = []; this.landed = 0; this.wrongSel = 0; this.sel = null;
    this.runwayBusy = false; this.numpad = null; this.spawnClock = 0; this.planeSeq = 0;
    this.running = false; this.lastGuideKey = '';

    UI.setCleanup(() => { cancelAnimationFrame(this.raf); this.running = false; });
    UI.briefing(this.field, `Tower briefing — ${this.def.id} ${this.def.name}`, [
      'Every inbound plane carries an <b>F-key tag</b>. Hold <kbd>FN</kbd> (right thumb, outer) — F1–F12 sit on the LEFT hand in a 3×4 grid.',
      'Press the tag of the plane <b>closest to the runway</b>. Shared tags? <kbd>Tab</kbd> cycles the candidates.',
      '<kbd>Enter</kbd> clears the selected plane to land. Clearing the wrong plane = go-around penalty.',
      'Planes burn holding fuel — a single fuel-out fails the shift.' +
        (this.def.numpad ? ' Some clearances ask for a heading on the FN numpad (right hand).' : ''),
      `Land ${this.def.land} · at most ${this.def.maxWrong} wrong clearances.`
    ], 'Open the frequency', () => this.go());
  },

  go() {
    this.running = true;
    this.t0 = performance.now(); this.lastT = this.t0;
    for (let i = 0; i < this.def.initial; i++) this.spawn(0.35 + i * 0.18);
    Keys.set({ capture: true, onKey: (e) => this.onKey(e) });
    this.guideClosest(true);
    const loop = (t) => {
      if (!this.running) return;
      const dt = Math.min(0.1, (t - this.lastT) / 1000);
      this.lastT = t;
      this.tick(dt);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  threshold() {
    return { x: this.field.clientWidth / 2, y: this.field.clientHeight - 60 };
  },
  dist(p) { const th = this.threshold(); return Math.hypot(p.x - th.x, p.y - th.y); },
  alive() { return this.planes.filter(p => !p.dead && !p.landing); },
  closest() {
    const a = this.alive();
    return a.length ? a.reduce((m, p) => this.dist(p) < this.dist(m) ? p : m) : null;
  },

  spawn(distFrac) {
    const W = this.field.clientWidth, H = this.field.clientHeight;
    const th = this.threshold();
    const ang = rnd(Math.PI * 0.15, Math.PI * 0.85);   // fan above the runway
    const R = (distFrac !== undefined ? distFrac : 1) * Math.min(H - 90, W * 0.48);
    const p = {
      id: ++this.planeSeq,
      callsign: pick(this.AIRLINES) + irnd(100, 999),
      tag: this.pickTag(),
      x: th.x + Math.cos(ang) * R * (Math.random() < 0.5 ? -1 : 1),
      y: th.y - Math.sin(ang) * R,
      speed: rnd(this.def.speed[0], this.def.speed[1]),
      fuelMax: this.def.fuel, fuel: this.def.fuel,
      landing: false, dead: false, dom: null
    };
    p.x = Math.max(30, Math.min(W - 30, p.x));
    p.y = Math.max(30, Math.min(th.y - 80, p.y));
    const d = el('div', 'plane',
      `<span class="ftag">${p.tag}</span><span class="icon" style="color:var(--green)">▲</span>
       <span class="fuel"><i style="width:100%"></i></span><span class="callsign">${p.callsign}</span>`);
    p.dom = d;
    this.field.append(d);
    this.planes.push(p);
  },
  pickTag() {
    const pool = Array.from({ length: this.def.tags }, (_, i) => 'F' + (i + 1));
    if (this.def.dup) return pick(pool);
    const used = this.alive().map(p => p.tag);
    const free = pool.filter(t => !used.includes(t));
    return free.length ? pick(free) : pick(pool);
  },

  tick(dt) {
    const th = this.threshold();
    // spawning
    this.spawnClock += dt;
    if (this.spawnClock >= this.def.spawnEvery && this.alive().length < this.def.maxPlanes) {
      this.spawnClock = 0;
      this.spawn();
    }
    for (const p of this.planes) {
      if (p.dead) continue;
      const d = this.dist(p);
      const vx = (th.x - p.x) / (d || 1), vy = (th.y - p.y) / (d || 1);
      if (p.landing) {
        p.x += vx * 95 * dt; p.y += vy * 95 * dt;
        if (d < 10) { this.touchdown(p); continue; }
      } else {
        if (d > 46) { p.x += vx * p.speed * dt; p.y += vy * p.speed * dt; }
        else { p.x += Math.sin(performance.now() / 500 + p.id) * 6 * dt; }   // hold pattern
        if (!(this.numpad && this.numpad.plane === p)) p.fuel -= dt;
        if (p.fuel <= 0) { this.failLevel(`${p.callsign} flamed out — a plane ran dry.`); return; }
      }
      this.drawPlane(p, th);
    }
    this.hud();
    this.guideClosest();
  },
  drawPlane(p, th) {
    p.dom.style.left = p.x + 'px';
    p.dom.style.top = p.y + 'px';
    const angle = Math.atan2(th.y - p.y, th.x - p.x) * 180 / Math.PI + 90;
    p.dom.querySelector('.icon').style.transform = `rotate(${angle}deg)`;
    const f = p.dom.querySelector('.fuel i');
    const frac = Math.max(0, p.fuel / p.fuelMax);
    f.style.width = (frac * 100) + '%';
    f.classList.toggle('low', frac < 0.25);
  },

  /* ── selection ───────────────────────────────────────────────── */
  candidates(tag) {
    return this.alive().filter(p => p.tag === tag).sort((a, b) => this.dist(a) - this.dist(b));
  },
  refreshSelection() {
    this.planes.forEach(p => { if (p.dom) { p.dom.classList.remove('sel', 'candidate'); } });
    if (!this.sel) return;
    const cands = this.candidates(this.sel.tag);
    if (!cands.length) { this.sel = null; return; }
    this.sel.idx = this.sel.idx % cands.length;
    cands.forEach((p, i) => p.dom.classList.add(i === this.sel.idx ? 'sel' : 'candidate'));
  },
  selectedPlane() {
    if (!this.sel) return null;
    const cands = this.candidates(this.sel.tag);
    return cands.length ? cands[this.sel.idx % cands.length] : null;
  },

  onKey(e) {
    if (!this.running) return false;
    const k = e.key;
    if (this.numpad) {
      if (/^[0-9]$/.test(k)) { this.numpad.typed += k; this.renderNumpad(); Sound.tick(); return true; }
      if (k === 'Backspace') { this.numpad.typed = this.numpad.typed.slice(0, -1); this.renderNumpad(); return true; }
      if (k === 'Enter') {
        if (this.numpad.typed === this.numpad.code) { const p = this.numpad.plane; this.closeNumpad(); this.land(p); }
        else { Sound.buzz(); this.numpad.typed = ''; this.renderNumpad(); this.say('Wrong heading — again.'); }
        return true;
      }
      return true;   // swallow everything else during the prompt
    }
    if (/^F\d{1,2}$/.test(k)) {
      const cands = this.candidates(k);
      if (!cands.length) { Sound.buzz(); this.say(`No traffic squawking ${k}.`); return true; }
      this.sel = { tag: k, idx: 0 };
      Sound.blip();
      this.refreshSelection();
      this.guideSelection();
      return true;
    }
    if (k === 'Tab') {
      if (this.sel) {
        const n = this.candidates(this.sel.tag).length;
        if (n > 1) { this.sel.idx = (this.sel.idx + 1) % n; Sound.blip(); this.refreshSelection(); }
      }
      return true;
    }
    if (k === 'Enter') {
      const p = this.selectedPlane();
      if (!p) { Sound.buzz(); this.say('Select a tag first (FN + F-key).'); return true; }
      if (this.runwayBusy) { Sound.buzz(); this.say('Runway occupied — hold.'); return true; }
      const closest = this.closest();
      if (p !== closest) {
        this.wrongSel++;
        Sound.buzz();
        this.say(`${p.callsign} go-around! ${closest ? closest.callsign + ' was next.' : ''}`);
        // loop the plane back out: it re-enters from further away, time is lost
        const th = this.threshold();
        const d = this.dist(p);
        const push = Math.min(d * 0.4 + 120, 260);
        const nx = p.x + (p.x - th.x) / (d || 1) * push, ny = p.y - Math.abs(push * 0.7);
        p.x = Math.max(30, Math.min(this.field.clientWidth - 30, nx));
        p.y = Math.max(30, ny);
        this.sel = null;
        this.refreshSelection();
        if (this.wrongSel > this.def.maxWrong) { this.failLevel('Too many wrong clearances — the chief pulls your headset.'); }
        return true;
      }
      if (this.def.numpad && Math.random() < CONFIG.numpadChance) { this.openNumpad(p); return true; }
      this.land(p);
      return true;
    }
    return false;
  },

  land(p) {
    p.landing = true;
    this.runwayBusy = true;
    this.runwayEl.classList.add('busy');
    this.sel = null;
    this.refreshSelection();
    this.say(`${p.callsign} cleared to land.`);
    Sound.good();
  },
  touchdown(p) {
    p.dead = true;
    p.dom.remove();
    this.landed++;
    Sound.good();
    setTimeout(() => { this.runwayBusy = false; this.runwayEl.classList.remove('busy'); }, 800);
    if (this.def.reshuffle) {
      this.alive().forEach(q => { q.tag = this.pickTag(); q.dom.querySelector('.ftag').textContent = q.tag; });
      this.sel = null;
      this.refreshSelection();
      this.say('Storm cell — tags reshuffled!');
    }
    if (this.landed >= this.def.land) this.finish();
  },

  /* ── FN numpad prompt (optional flavour, config-gated) ───────── */
  openNumpad(p) {
    const code = String(irnd(0, 35) * 10).padStart(3, '0');
    this.numpad = { plane: p, code, typed: '' };
    this.npEl = el('div', 'tw-numpad');
    this.field.append(this.npEl);
    this.renderNumpad();
  },
  renderNumpad() {
    const n = this.numpad;
    this.npEl.innerHTML =
      `<div style="font-size:12px;color:var(--dim)">TOWER: "${n.plane.callsign}, say heading <b style="color:var(--amber)">${n.code}</b>" — FN numpad, then Enter</div>
       <div class="np-in">${esc(n.typed) || '···'}</div>`;
    const next = n.code[n.typed.length];
    if (n.typed === n.code) Guide.forKeyName('Enter', 'Ent — read back complete');
    else if (next) Guide.forChar(next, `${next} (FN numpad)`);
    else Guide.forKeyName('Backspace', 'Bsp — too many digits');
  },
  closeNumpad() {
    if (this.npEl) this.npEl.remove();
    this.numpad = null;
  },

  /* ── guide & hud ─────────────────────────────────────────────── */
  guideClosest(force) {
    if (this.numpad) return;
    if (this.sel) return;      // selection guide is active
    const c = this.closest();
    if (!c) return;
    const key = 'closest:' + c.tag + c.id;
    if (!force && key === this.lastGuideKey) return;
    this.lastGuideKey = key;
    Guide.forChar(c.tag, `${c.tag} — select ${c.callsign} (closest)`);
  },
  guideSelection() {
    this.lastGuideKey = 'sel';
    Guide.forCluster(0, ['Tab', 'Enter'],
      'Tab cycles planes sharing the tag · Enter clears the selected plane to land');
  },
  say(msg) {
    this.msgEl.textContent = msg;
    this.msgEl.style.display = 'block';
    clearTimeout(this._sayT);
    this._sayT = setTimeout(() => { this.msgEl.style.display = 'none'; }, 2600);
  },
  hud() {
    const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
    set('t-land', `${this.landed}/${this.def.land}`);
    set('t-wrong', this.wrongSel);
    set('t-air', this.alive().length);
    set('t-time', fmtTime((performance.now() - this.t0) / 1000));
  },

  /* ── endings ─────────────────────────────────────────────────── */
  failLevel(note) {
    if (!this.running) return;
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.closeNumpad();
    Save.record(this.def.id, false, null, 'time', true);
    UI.results({
      levelId: this.def.id, passed: false, failNote: note,
      rows: [['Landed', `${this.landed}/${this.def.land}`], ['Wrong clearances', this.wrongSel],
             ['Time', fmtTime((performance.now() - this.t0) / 1000)]],
      onRetry: () => this.start(this.lv)
    });
  },
  finish() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.closeNumpad();
    const time = (performance.now() - this.t0) / 1000;
    const passed = this.wrongSel <= this.def.maxWrong;
    Save.record(this.def.id, passed, { time: Math.round(time), wrong: this.wrongSel }, 'time', true);
    UI.results({
      levelId: this.def.id, passed,
      failNote: passed ? null : 'Too many wrong clearances.',
      rows: [['Landed', `${this.landed}/${this.def.land}`],
             ['Wrong clearances', `${this.wrongSel} (max ${this.def.maxWrong})`],
             ['Shift time', fmtTime(time)]],
      onRetry: () => this.start(this.lv)
    });
  }
};
/* ── boot ───────────────────────────────────────────────────────── */
Save.load();
UI.init();
Keys.install();
Guide.init();
document.addEventListener('pointerdown', () => Sound.musicStart(), { once: true });
document.addEventListener('keydown', () => Sound.musicStart(), { once: true });
Screens.menu();
if (!Save.canStore) UI.toast('Heads-up: storage is unavailable, progress lives only in this session.');
</script>
</body>
</html>
